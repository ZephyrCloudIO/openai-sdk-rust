[package]
name = "openai"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust SDK for the OpenAI API"

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
anyhow = "1"
futures = "0.3"
tokio-stream = "0.1"
eventsource-stream = "0.2"
async-stream = "0.3"
async-trait = "0.1"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2"
urlencoding = "2"
base64 = "0.22"
tokio-util = { version = "0.7", features = ["rt"] }

azure_core = { version = "0.22", optional = true }
azure_identity = { version = "0.22", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
proptest = "1"
criterion = { version = "0.5", features = ["async_tokio"] }
openai-azure = { path = "../openai-azure", features = ["config"] }

[[bench]]
name = "serde_bench"
harness = false

[features]
default = ["rustls"]
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
azure = ["dep:azure_core", "dep:azure_identity"]
